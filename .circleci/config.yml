version: 2.1

jobs:
  test:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    resource_class: medium
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: false
      - run:
          name: Install uv
          command: |
            python -m pip install --upgrade pip
            python -m pip install uv
      - run:
          name: Install dependencies
          command: uv sync --all-groups
      - run:
          name: Run baseline tests
          command: |
            uv run pytest -vv --disable-warnings --tb=short \
              --ignore=tests/ssh/test_ssh_connector.py \
              --ignore=tests/ssh/test_ssh_factory.py \
              --ignore=tests/docker/

  docker-integration-lifecycle:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: false
      - run:
          name: Install uv
          command: |
            python -m pip install --upgrade pip
            python -m pip install uv
      - run:
          name: Docker lifecycle integration
          command: uv sync --all-groups && uv run pytest -vv --disable-warnings --tb=short tests/docker/test_docker_container.py::test_docker_container_resource_lifecycle

  docker-integration-command:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: false
      - run:
          name: Install uv
          command: |
            python -m pip install --upgrade pip
            python -m pip install uv
      - run:
          name: Docker command integration
          command: uv sync --all-groups && uv run pytest -vv --disable-warnings --tb=short tests/docker/test_docker_command_executor.py::test_basic_command_without_piping

  lint:
    docker:
      - image: cimg/python:3.10
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            python -m pip install --upgrade pip
            python -m pip install uv
      - run:
          name: Install dependencies
          command: uv sync --all-groups
      - run:
          name: Run pflake8
          command: uv run pflake8 src/marsh --select=E9,F --ignore=F401,F403,F405,F541,F811,F841

  build:
    docker:
      - image: cimg/python:3.10
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            python -m pip install --upgrade pip
            python -m pip install uv
      - run:
          name: Install dependencies
          command: uv sync --all-groups
      - run:
          name: Build wheel
          command: uv build --wheel --out-dir dist -v

workflows:
  baseline:
    jobs:
      - test:
          matrix:
            parameters:
              python-version: ["3.10", "3.11", "3.12"]
      - lint
      - docker-integration-lifecycle
      - docker-integration-command
      - docker-integration
      - build
