version: 2.1

jobs:
  test:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            python -m pip install --upgrade pip
            python -m pip install uv
      - run:
          name: Install dependencies
          command: uv sync --all-groups
      - run:
          name: Run baseline tests
          command: |
            uv run pytest -vv --disable-warnings --tb=short \
              --ignore=tests/ssh/test_ssh_connector.py \
              --ignore=tests/ssh/test_ssh_factory.py \
              --ignore=tests/docker/

  lint:
    docker:
      - image: cimg/python:3.10
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            python -m pip install --upgrade pip
            python -m pip install uv
      - run:
          name: Install dependencies
          command: uv sync --all-groups
      - run:
          name: Run pflake8
          command: uv run pflake8 src/marsh --select=E9,F --ignore=F401,F403,F405,F541,F811,F841

  build:
    docker:
      - image: cimg/python:3.10
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            python -m pip install --upgrade pip
            python -m pip install uv
      - run:
          name: Install dependencies
          command: uv sync --all-groups
      - run:
          name: Build wheel
          command: uv build --wheel --out-dir dist -v

  integration:
    machine:
      image: ubuntu-2404:current
      docker_layer_caching: false
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            python3 -m pip install --upgrade pip
            python3 -m pip install uv
      - run:
          name: Install dependencies
          command: uv sync --all-groups
      - run:
          name: Validate dependency and platform contract
          command: |
            uv run python - <<'PY'
            import sys
            from pathlib import Path
            import tomllib

            assert sys.version_info[:2] == (3, 12), sys.version
            project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
            assert "optional-dependencies" not in project, "Unexpected optional dependency surface"
            assert project["requires-python"] == ">=3.10,<3.13"
            print("Python 3.12 integration environment validated; optional dependency surface is N/A.")
            PY
      - run:
          name: Run Docker integration tests
          command: uv run pytest -vv --disable-warnings --tb=short tests/docker
      - run:
          name: Run SSH integration tests
          command: uv run pytest -vv --disable-warnings --tb=short tests/ssh

workflows:
  baseline:
    jobs:
      - test:
          matrix:
            parameters:
              python-version: ["3.10", "3.11", "3.12"]
      - lint
      - build
      - integration
