version: 2.1

jobs:
  test:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            python -m pip install --upgrade pip
            python -m pip install uv
      - run:
          name: Install dependencies
          command: uv sync --all-groups
      - run:
          name: Run baseline tests
          command: |
            mkdir -p test-results
            uv run pytest -vv --disable-warnings --tb=short \
              --junitxml=test-results/junit.xml \
              --ignore=tests/ssh/test_ssh_connector.py \
              --ignore=tests/ssh/test_ssh_factory.py \
              --ignore=tests/docker/
      - store_test_results:
          path: test-results

  lint:
    docker:
      - image: cimg/python:3.10
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            python -m pip install --upgrade pip
            python -m pip install uv
      - run:
          name: Install dependencies
          command: uv sync --all-groups
      - run:
          name: Run pflake8
          command: uv run pflake8 src/marsh --select=E9,F --ignore=F401,F403,F405,F541,F811,F841

  build:
    docker:
      - image: cimg/python:3.10
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            python -m pip install --upgrade pip
            python -m pip install uv
      - run:
          name: Install dependencies
          command: uv sync --all-groups
      - run:
          name: Build wheel
          command: uv build --wheel --out-dir dist -v

  integration:
    machine:
      image: ubuntu-2404:current
      docker_layer_caching: false
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            set -euxo pipefail
            python3 -m pip install --upgrade pip
            python3 -m pip install --user uv==0.12.12
            USER_BIN="$(python3 -m site --user-base)/bin"
            echo "export PATH=\"$USER_BIN:\$PATH\"" >> "$BASH_ENV"
            export PATH="$USER_BIN:$PATH"
            "$USER_BIN/uv" --version
            command -v uv
      - run:
          name: Install dependencies
          command: uv sync --all-groups --extra docker --extra ssh
      - run:
          name: Validate dependency and platform contract
          command: |
            uv run python - \<<'PY'
            import sys
            from pathlib import Path
            import tomllib

            assert sys.version_info[:2] == (3, 12), sys.version
            project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
            extras = project["optional-dependencies"]
            dependencies = project["dependencies"]
            assert not any(dep.startswith("docker") for dep in dependencies)
            assert not any(dep.startswith("fabric") for dep in dependencies)
            assert any(dep.startswith("docker") for dep in extras["docker"])
            assert any(dep.startswith("fabric") for dep in extras["ssh"])
            assert project["requires-python"] == ">=3.10,<3.13"
            print("Python 3.12 integration environment and optional provider dependency contract validated.")
            PY
      - run:
          name: Pull Docker integration test images
          command: |
            docker pull bash:latest
            docker pull ubuntu:24.04
      - run:
          name: Run Docker integration tests
          command: |
            uv run pytest -vv --disable-warnings --tb=short tests/docker
            uv run pytest -vv --disable-warnings --tb=short tests/core/test_provider_architecture.py::test_docker_provider_executes_real_container
      - run:
          name: Run SSH integration tests
          command: uv run pytest -vv --disable-warnings --tb=short tests/ssh

workflows:
  baseline:
    jobs:
      - test:
          matrix:
            parameters:
              python-version: ["3.10", "3.11", "3.12"]
      - lint
      - build
      - integration
