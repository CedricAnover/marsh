[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marsh-lib"
version = "0.3.7"
description = "Lightweight, extensible Python library for building, managing, and executing command workflows."
authors = [{ name = "Cedric Anover", email = "cedric.anover@hotmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = ["marsh", "marsh-lib"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Shells",
    "Topic :: System :: System Shells",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.optional-dependencies]
docker = [
    "docker>=7.1.0,<8.0.0",
]
ssh = [
    "fabric>=3.2.2,<4.0.0",
]

[project.urls]
Repository = "https://github.com/CedricAnover/marsh"

[dependency-groups]
dev = [
    "pyproject-flake8>=7.0.0,<8.0.0", # Usage: `uv run pflake8`
    "isort>=5.13.2,<6.0.0",
    "black>=24.10.0,<25.0.0",
    "fabric[pytest]>=3.2.2,<4.0.0",
]
test = [
    "docker>=7.1.0,<8.0.0",
    "fabric[pytest]>=3.2.2,<4.0.0",
    "pytest>=8.3.2,<9.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "testcontainers>=4.9.0,<5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marsh"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/tests",
    "/samples",
]

[tool.flake8]
max-line-length = 120
ignore = ["E226", "E302", "E41", "E501", "W293"]
extend-ignore = []
exclude = [
    ".git",
    "__pycache__",
    "docs/source/conf.py",
    "build",
    "dist",
    "venv",
    ".venv",
]

[tool.flake8.files]
include = ["src/**/*.py"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
#extend-exclude = '...'


[tool.pytest.ini_options]
markers = [
    "integration: requires external runtime services such as Docker or SSH",
]
