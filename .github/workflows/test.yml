name: Python Test

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["develop", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          uv sync --all-groups

      - name: Run pytest
        run: |
          cd src
          uv run --with coverage --with pytest-cov pytest \
            -vv --disable-warnings \
            --tb=short --cov-report xml:../coverage.xml --cov=marsh \
            --ignore=../tests/ssh/test_ssh_connector.py \
            --ignore=../tests/ssh/test_ssh_factory.py \
            --ignore=../tests/docker/ \
            ../tests/

      - name: Get Coverage
        if: ${{ github.event_name == 'pull_request' }}
        uses: orgoro/coverage@v3.2
        with:
            coverageFile: coverage.xml
            token: ${{ secrets.GITHUB_TOKEN }}

  windows_portability:
    name: Windows portability (Python 3.12)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run portable pytest suite
        run: >
          uv run pytest -vv --disable-warnings --tb=short
          --ignore=tests/bash
          --ignore=tests/docker
          --ignore=tests/ssh
          tests/
