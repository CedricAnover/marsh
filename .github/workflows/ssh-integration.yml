name: SSH Integration Smoke

on:
  pull_request:
    branches:
      - develop
    paths:
      - "src/marsh/ssh/**"
      - "tests/ssh/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ssh-integration.yml"

permissions:
  contents: read

jobs:
  ssh-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.12"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Configure local SSH server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          sudo useradd --create-home --shell /bin/bash marsh-ci
          sudo install -d -m 700 -o marsh-ci -g marsh-ci /home/marsh-ci/.ssh
          echo "marsh-ci:marsh-password" | sudo chpasswd
          sudo mkdir -p /run/sshd
          cat > "$RUNNER_TEMP/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/ssh_host_ed25519_key
          PubkeyAuthentication yes
          PasswordAuthentication yes
          PermitRootLogin no
          UsePAM no
          PidFile $RUNNER_TEMP/sshd.pid
          AllowUsers marsh-ci
          EOF
          sudo /usr/sbin/sshd -f "$RUNNER_TEMP/sshd_config"

      - name: Run SSH smoke test
        env:
          MARSH_SSH_TARGET: marsh-ci@127.0.0.1:2222
          MARSH_SSH_PASSWORD: marsh-password
        run: uv run pytest -vv --disable-warnings --tb=short tests/ssh/test_local_sshd_smoke.py
